name: Publish Glon challenge site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout challenge repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation build dependency
        run: python -m pip install -r requirements.txt

      - name: Read pinned interpreter commit
        id: interpreter
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("interpreter.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Build pinned Glon interpreter
        run: bash scripts/build-interpreter.sh "${{ steps.interpreter.outputs.commit }}" "$RUNNER_TEMP/glon-eng"

      - name: Run challenge cases and resource probes
        run: |
          python3 scripts/run-challenges.py \
            --glon "$RUNNER_TEMP/glon-eng/glon" \
            --output results \
            --run-probes

      - name: Build verified challenge site
        run: |
          python3 scripts/build-site.py \
            --results results \
            --out _site \
            --require-pass

      - name: Build language documentation from pinned upstream Markdown
        run: |
          python3 scripts/build-docs.py \
            --upstream "$RUNNER_TEMP/glon-eng" \
            --out _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
